# Included in Beanstalk's server block. Lesson video upload (up to 5 GB, not in
# legacy): the file streams to Node (never spooled to disk) and the API streams
# it on to R2. Other routes keep the limits in ../bodhira.conf.
location ~ ^/api/v1/content/lessons/[0-9]+/video-upload/stream$ {
    client_max_body_size 5G;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_pass http://127.0.0.1:8080; # the app (PORT=8080 in .ebextensions)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
