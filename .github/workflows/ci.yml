# Checks every push and pull request. The e2e suite needs a seeded database,
# so it runs locally (README).
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx eslint "{src,apps,libs,test}/**/*.ts"
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - run: npm run build
