# Production deploy (DEPLOY.md §6): after CI passes on main, or by hand
# (Actions → Deploy → Run workflow). One job, in this order:
#   1. build;
#   2. migrations against Supabase (a failure deploys nothing);
#   3. the background-job worker over SSH (PM2), before the API, so the new
#      worker runs jobs from old and new API instances alike;
#   4. the web API to Elastic Beanstalk (S3 bundle → application version →
#      rolling update), then waits until the environment is Ready and on this version.
# Runs only in aveniqinnovations/ba-api (the live repo). AWS access is OIDC: no keys
# stored here; the role trusts this repo's main branch only.
#
# GitHub → Settings → Environments → production:
#   secret   MIGRATE_DATABASE_URL    Supabase session pooler (5432) + ?uselibpqcompat=true&sslmode=require
#   secret   WORKER_SSH_KEY          the worker deploy user's private key (ed25519)
#   variable WORKER_SSH_HOST, WORKER_SSH_USER, WORKER_SSH_KNOWN_HOSTS, WORKER_SSH_PORT (optional, 22)
#   variable DEPLOY_PATH             the worker's app folder (holds its .env)
#   variable AWS_ROLE_ARN, AWS_REGION, EB_APPLICATION, EB_ENVIRONMENT
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for the AWS role

jobs:
  deploy:
    # Deploys only from the live repo; the same workflow in other copies of the repo skips.
    if: >-
      github.repository == 'aveniqinnovations/ba-api' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI checked (workflow_run), or the chosen branch (manual run).
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Migrations (Supabase)
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: |
          [ -n "$DATABASE_URL" ] || { echo "::error::Missing MIGRATE_DATABASE_URL: set it in the production environment"; exit 1; }
          npm run db:migrate

      - name: SSH setup (worker)
        env:
          KEY: ${{ secrets.WORKER_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.WORKER_SSH_KNOWN_HOSTS }}
          HOST: ${{ vars.WORKER_SSH_HOST }}
          SSH_USER: ${{ vars.WORKER_SSH_USER }}
          PORT: ${{ vars.WORKER_SSH_PORT }}
        run: |
          for v in KEY KNOWN_HOSTS HOST SSH_USER; do
            [ -n "${!v}" ] || { echo "::error::Missing $v: set it in the production environment"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/worker_key && chmod 600 ~/.ssh/worker_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host worker
            HostName $HOST
            User $SSH_USER
            Port ${PORT:-22}
            IdentityFile ~/.ssh/worker_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
          CONF

      - name: Worker (PM2)
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          [ -n "$DEPLOY_PATH" ] || { echo "::error::Missing DEPLOY_PATH: set it in the production environment"; exit 1; }
          scripts/deploy-worker.sh worker "$SHA"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Web API (Elastic Beanstalk)
        env:
          APP: ${{ vars.EB_APPLICATION }}
          ENV_NAME: ${{ vars.EB_ENVIRONMENT }}
        run: scripts/deploy-eb.sh "$APP" "$ENV_NAME" "${SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/worker_key
